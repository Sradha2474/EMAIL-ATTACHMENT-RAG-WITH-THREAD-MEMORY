services:
  api:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./runs:/app/runs
      - ./index:/app/index

  ui:
    build: .
    command: streamlit run app/ui.py --server.port 8501 --server.address 0.0.0.0
    ports:
      - "8501:8501"
    depends_on:
      - api
    environment:
      - API_URL=http://api:8000